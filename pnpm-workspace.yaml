packages:
  - 'apps/*'

# 明示設定時は strict がデフォルト true。false なら未成熟版へフォールバック可
minimumReleaseAgeStrict: false

minimumReleaseAgeExclude:
  # Angular / Nx / 主要ツールチェーンは公開直後も許可
  - '@analogjs/*'
  - '@angular/*'
  - '@angular-devkit/*'
  - '@commitlint/*'
  - '@eslint/*'
  - '@gurezo/*'
  - '@nx/*'
  - '@schematics/*'
  - '@swc/*'
  - '@testing-library/*'
  - '@types/*'
  - '@typescript-eslint/*'
  - '@vitest/*'
  - eslint
  - nx
  - prettier
  - typescript
  - typescript-eslint
  - vite
  - vitest
  - '@ngtools/webpack@22.1.3'
  - globals@17.9.0
  - jsonc-eslint-parser@3.2.0
  - nanoid@3.3.17
  - postcss@8.5.26
  - verkit@0.3.2
  - '@ngtools/webpack@22.1.5'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - lmdb
  - msgpackr-extract
  - nx

# Malicious releases are often detected and removed within a week.
# 7 days x 24h x 60 min
# minimumReleaseAge: 10080

allowBuilds:
  '@parcel/watcher': set this to true or false
  '@swc/core': set this to true or false
  esbuild: set this to true or false
  less: set this to true or false
  lmdb: set this to true or false
  msgpackr-extract: set this to true or false
  nx: set this to true or false
