packages:
  - 'apps/*'

# 明示設定時は strict がデフォルト true。false なら未成熟版へフォールバック可
minimumReleaseAgeStrict: false

minimumReleaseAgeExclude:
  # Angular / Nx / 主要ツールチェーンは公開直後も許可
  - '@analogjs/*'
  - '@angular/*'
  - '@angular-devkit/*'
  - '@commitlint/*'
  - '@eslint/*'
  - '@gurezo/*'
  - '@ngrx/*'
  - '@ngtools/*'
  - '@nx/*'
  - '@oxc-project/*'
  - '@rolldown/*'
  - '@schematics/*'
  - '@swc/*'
  - '@testing-library/*'
  - '@types/*'
  - '@typescript-eslint/*'
  - '@vitest/*'
  - eslint
  - eslint-plugin-tailwindcss
  - globals
  - jasmine-core
  - jsonc-eslint-parser
  - nanoid
  - ngx-monaco-editor-v2
  - nx
  - postcss
  - prettier
  - rolldown
  - typescript
  - typescript-eslint
  - verkit
  - vite
  - vitest

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - lmdb
  - msgpackr-extract
  - nx

# Malicious releases are often detected and removed within a week.
# 7 days x 24h x 60 min
minimumReleaseAge: 10080

allowBuilds:
  '@parcel/watcher': set this to true or false
  '@swc/core': set this to true or false
  esbuild: set this to true or false
  less: set this to true or false
  lmdb: set this to true or false
  msgpackr-extract: set this to true or false
  nx: set this to true or false
