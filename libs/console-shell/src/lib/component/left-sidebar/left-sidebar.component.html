<div
  class="relative flex min-h-0 min-w-0 flex-1 flex-row overflow-hidden border-r border-gray-200"
>
  @if (leftNavOpen()) {
    @if (isOverlay()) {
      <div
        id="console-shell-left-pane"
        class="absolute top-0 bottom-0 left-full z-40 flex min-h-0 min-w-0 flex-col overflow-hidden border-r border-gray-200 bg-white shadow-lg"
        [style.width]="overlayWidth()"
      >
        <lib-file-tree-feature
          [currentPath]="shellStore.fileManagerCurrentPath()"
          [selectedPath]="shellStore.selectedFilePath()"
          [hasUnsavedDraft]="hasUnsavedDraft"
          (currentPathChange)="onCurrentPathChange($event)"
          (fileSelected)="onFileSelected($event)"
          (fileCreated)="onFileCreated($event)"
          (fileRenamed)="onFileRenamed($event)"
          (fileDeleted)="onFileDeleted($event)"
        />
        <div
          role="separator"
          aria-orientation="vertical"
          aria-label="Resize left panel"
          tabindex="0"
          class="shell-pane-separator absolute top-0 right-0 bottom-0 z-50 w-1.5 cursor-col-resize touch-none bg-transparent hover:bg-blue-500/40"
          (pointerdown)="onResizePointerDown($event)"
          (keydown)="onResizeKeydown($event)"
        ></div>
      </div>
    } @else {
      <div
        id="console-shell-left-pane"
        class="flex min-h-0 min-w-0 flex-col overflow-hidden bg-white"
        [style.width.px]="treeWidthPx()"
      >
        <lib-file-tree-feature
          [currentPath]="shellStore.fileManagerCurrentPath()"
          [selectedPath]="shellStore.selectedFilePath()"
          [hasUnsavedDraft]="hasUnsavedDraft"
          (currentPathChange)="onCurrentPathChange($event)"
          (fileSelected)="onFileSelected($event)"
          (fileCreated)="onFileCreated($event)"
          (fileRenamed)="onFileRenamed($event)"
          (fileDeleted)="onFileDeleted($event)"
        />
      </div>
    }
  }
  <div
    class="relative flex w-12 shrink-0 flex-col items-center gap-1 border-l border-gray-200 bg-white py-2"
  >
    <button
      mat-icon-button
      type="button"
      class="shell-rail-button"
      [matTooltip]="contentLabel"
      [attr.aria-label]="contentLabel"
      [attr.aria-expanded]="leftNavOpen()"
      aria-controls="console-shell-left-pane"
      (click)="toggleLeftSidebar.emit()"
    >
      <mat-icon aria-hidden="true">folder</mat-icon>
    </button>
    <button
      mat-icon-button
      type="button"
      class="shell-rail-button"
      [matTooltip]="panelToggleLabel()"
      [attr.aria-label]="panelToggleLabel()"
      [attr.aria-expanded]="leftNavOpen()"
      aria-controls="console-shell-left-pane"
      (click)="toggleLeftSidebar.emit()"
    >
      <mat-icon aria-hidden="true">
        @if (leftNavOpen()) {
          left_panel_close
        } @else {
          left_panel_open
        }
      </mat-icon>
    </button>
    @if (isDockedOpen()) {
      <div
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize left panel"
        tabindex="0"
        class="shell-pane-separator absolute top-0 right-0 bottom-0 z-50 w-1.5 cursor-col-resize touch-none bg-transparent hover:bg-blue-500/40"
        (pointerdown)="onResizePointerDown($event)"
        (keydown)="onResizeKeydown($event)"
      ></div>
    }
  </div>
</div>
