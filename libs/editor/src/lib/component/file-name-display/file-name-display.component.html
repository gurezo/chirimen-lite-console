<div class="file-name-display flex flex-wrap items-center gap-x-2 gap-y-1 px-3 py-1 text-sm">
  @if (fileName()) {
    <span>
      {{ fileName() }}
      @if (isDirty()) {
        <span aria-hidden="true"> *</span>
      }
    </span>
  } @else {
    <span>—</span>
  }

  @if (statusLabel(); as label) {
    <span
      class="text-xs text-neutral-600"
      role="status"
      aria-live="polite"
      data-testid="editor-save-status"
    >
      {{ label }}
    </span>
  }
</div>
